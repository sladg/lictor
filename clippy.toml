# Warn above 6 arguments. `clippy::all` is denied, so this is a hard gate.
#
# Set to catch the growth that actually happened rather than to hit a round
# number: `push_variant` reached 7 by gaining one field at a time (rewritable,
# then group), and each step meant editing every signature in the parse chain.
# 7 now fails.
#
# Not 5. Four functions sit at 6 -- `engine::write_audit`,
# `jail::relative_hints_at`, `path_check::check`, `rules::strip_program_paths`
# -- and their parameters do not travel together as a unit, so wrapping them
# would make every call site longer and buy nothing. Arity is not the signal;
# cohesion is. Lower this if that stops being true.
too-many-arguments-threshold = 6
