# Warn above 3 arguments. `clippy::all` is denied, so this is a hard gate.
#
# Deliberately aggressive: the default of 7 never fires until a signature is
# already unpleasant, and `push_variant` reached exactly 7 one field at a time
# without anything complaining. A low bar makes a fourth argument a decision
# rather than a drift.
#
# Functions that genuinely need more carry a targeted allow attribute for this
# lint, with a one-line reason at the site. That is the point: the exception is
# visible and argued, instead of the threshold being quietly raised until
# nothing is flagged at all.
#
# Note `self` counts toward the total, so a three-argument method trips this.
# Two of the exceptions exist only for that reason.
too-many-arguments-threshold = 3
