# Per-program argument maps — issue #13, sub-task 5.
#
# What each argument MEANS to each program: which slots are paths, which flags
# consume the next word, and what the program does to what it names.
#
# ── The rule for this file ──
#
# Hand-written and reviewed. There are no provenance tiers and no runtime
# `--help` probing: a `--help` pass may be used ONCE to draft an entry, and its
# output is reviewed by a person before it lands here.
#
# A program with no entry gets no reference edges, and lictor says nothing about
# it. That is deliberate — silence on an unmapped program is the honest failure
# direction, and it is the whole reason this file exists instead of another
# heuristic. Adding an entry is cheap; guessing is not.
#
# ── Fields ──
#
#   slots   all | first | last | except-last | rest | <number>
#           Counted AFTER flag arguments are removed, so `grep -e pat file` has
#           one positional, not two.
#   kind    none | path | cmd   (pathset/glob/regex/code/url/host/container are
#           accepted but produce no edges yet — sub-task 6 onward)
#   effect  read | write | delete | create | exec   — a set, because one argument
#           is often several things at once
#
# This is a starter set, chosen for the programs that already appear in the
# rules and tests. It is meant to grow.

# ── reading ──

[[cmd]]
name = "cat"
[[cmd.args]]
slots = "all"
kind = "path"
effect = ["read"]

[[cmd]]
name = "head"
[cmd.flags]
"-n" = { takes = true }
"-c" = { takes = true }
[[cmd.args]]
slots = "all"
kind = "path"
effect = ["read"]

[[cmd]]
name = "tail"
[cmd.flags]
"-n" = { takes = true }
"-c" = { takes = true }
[[cmd.args]]
slots = "all"
kind = "path"
effect = ["read"]

[[cmd]]
name = "wc"
[[cmd.args]]
slots = "all"
kind = "path"
effect = ["read"]

# `-e` and `-f` are the reason this program needs a map at all: without one,
# `grep -e /needle/ file` reads as two positionals and the pattern looks like a
# path. That is issue #4.
[[cmd]]
name = "grep"
[cmd.flags]
"-e" = { takes = true, kind = "regex" }
"--regexp" = { takes = true, kind = "regex" }
"-f" = { takes = true, kind = "path", effect = ["read"] }
"--file" = { takes = true, kind = "path", effect = ["read"] }
"-m" = { takes = true }
"--max-count" = { takes = true }
[[cmd.args]]
slots = "all"
kind = "path"
effect = ["read"]
# later entries win, so slot 0 is the pattern rather than a path -- but ONLY when
# the pattern was not already given by a flag, or the first file would be read as
# a pattern and lose its edge
[[cmd.args]]
slots = "first"
kind = "regex"
when = { without = ["-e", "--regexp", "-f", "--file"] }

[[cmd]]
name = "rg"
[cmd.flags]
"-e" = { takes = true, kind = "regex" }
"--regexp" = { takes = true, kind = "regex" }
"-f" = { takes = true, kind = "path", effect = ["read"] }
"-m" = { takes = true }
[[cmd.args]]
slots = "all"
kind = "path"
effect = ["read"]
[[cmd.args]]
slots = "first"
kind = "regex"
when = { without = ["-e", "--regexp", "-f"] }

# sed's script is program text, not a path — `sed -n '/needle/p' README.md`
# denied on `/needle/p` is the exact false positive #4 reported.
[[cmd]]
name = "sed"
[cmd.flags]
"-e" = { takes = true, kind = "code" }
"--expression" = { takes = true, kind = "code" }
"-f" = { takes = true, kind = "path", effect = ["read"] }
"--file" = { takes = true, kind = "path", effect = ["read"] }
"-i" = { takes = false }
[[cmd.args]]
slots = "all"
kind = "path"
effect = ["read"]
[[cmd.args]]
slots = "first"
kind = "code"
when = { without = ["-e", "--expression", "-f", "--file"] }

[[cmd]]
name = "awk"
[cmd.flags]
"-f" = { takes = true, kind = "path", effect = ["read"] }
"-v" = { takes = true }
[[cmd.args]]
slots = "all"
kind = "path"
effect = ["read"]
[[cmd.args]]
slots = "first"
kind = "code"
when = { without = ["-f"] }

# ── writing and destroying ──

[[cmd]]
name = "rm"
[[cmd.args]]
slots = "all"
kind = "path"
effect = ["delete"]

[[cmd]]
name = "unlink"
[[cmd.args]]
slots = "all"
kind = "path"
effect = ["delete"]

[[cmd]]
name = "rmdir"
[[cmd.args]]
slots = "all"
kind = "path"
effect = ["delete"]

[[cmd]]
name = "mkdir"
[[cmd.args]]
slots = "all"
kind = "path"
effect = ["create"]

[[cmd]]
name = "touch"
[[cmd.args]]
slots = "all"
kind = "path"
effect = ["create", "write"]

# the destination is written and created; the sources are only read
[[cmd]]
name = "cp"
[[cmd.args]]
slots = "except-last"
kind = "path"
effect = ["read"]
[[cmd.args]]
slots = "last"
kind = "path"
effect = ["write", "create"]

# a move both reads AND deletes its source — the case that makes `effect` a set
# rather than a single value
[[cmd]]
name = "mv"
[[cmd.args]]
slots = "except-last"
kind = "path"
effect = ["read", "delete"]
[[cmd.args]]
slots = "last"
kind = "path"
effect = ["write", "create"]

[[cmd]]
name = "ln"
[[cmd.args]]
slots = "except-last"
kind = "path"
effect = ["read"]
[[cmd.args]]
slots = "last"
kind = "path"
effect = ["create"]

# ── wrappers: the program is somewhere in the arguments ──
#
# This is what makes `sudo grep …` reach the grep rules. Stage 1 had no way to
# say it, so `sudo` was one command with `grep` as an argument.

[[cmd]]
name = "sudo"
[cmd.flags]
"-u" = { takes = true }
"-g" = { takes = true }
"-C" = { takes = true }
[[cmd.args]]
slots = "rest"
kind = "cmd"
effect = ["exec"]

[[cmd]]
name = "doas"
[[cmd.args]]
slots = "rest"
kind = "cmd"
effect = ["exec"]

[[cmd]]
name = "env"
[[cmd.args]]
slots = "rest"
kind = "cmd"
effect = ["exec"]

[[cmd]]
name = "xargs"
[cmd.flags]
"-n" = { takes = true }
"-I" = { takes = true }
"-P" = { takes = true }
"-a" = { takes = true, kind = "path", effect = ["read"] }
[[cmd.args]]
slots = "rest"
kind = "cmd"
effect = ["exec"]

[[cmd]]
name = "nohup"
[[cmd.args]]
slots = "rest"
kind = "cmd"
effect = ["exec"]

[[cmd]]
name = "timeout"
[[cmd.args]]
slots = "rest"
kind = "cmd"
effect = ["exec"]

# ── git, where the subcommand decides everything ──

[[cmd]]
name = "git"
subcommand = "rm"
[cmd.flags]
"--cached" = { takes = false }
[[cmd.args]]
slots = "all"
kind = "path"
effect = ["delete"]

[[cmd]]
name = "git"
subcommand = "mv"
[[cmd.args]]
slots = "except-last"
kind = "path"
effect = ["read", "delete"]
[[cmd.args]]
slots = "last"
kind = "path"
effect = ["write", "create"]

[[cmd]]
name = "git"
subcommand = "add"
[[cmd.args]]
slots = "all"
kind = "path"
effect = ["read"]
