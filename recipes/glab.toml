[[cmd]]
name = "glab"
[cmd.flags]
"-R" = { takes = true }
"--repo" = { takes = true }

[[cmd]]
name = "glab"
subcommand = "repo clone"
effect = ["read"]
[[cmd.args]]
slots  = "1"
kind   = "path"
effect = ["create"]

[[cmd]]
name = "glab"
subcommand = "release upload"
effect = ["write"]
# slot 0 is the release TAG; every later positional is an asset file. Entries
# resolve last-match-wins, so the `first = none` line shadows `all` for slot 0.
[[cmd.args]]
slots  = "all"
kind   = "path"
effect = ["read"]
[[cmd.args]]
slots  = "first"
kind   = "none"

# effect claims for the remote-noun subcommands (see gh.toml)
[[cmd]]
name = "glab"
subcommand = "mr list"
effect = ["read"]

[[cmd]]
name = "glab"
subcommand = "mr view"
effect = ["read"]

