# `ssh host cat /etc/hosts` reads a file — on ANOTHER machine. Issue #4 listed
# it as a false positive, and the fix used to be silence: leave the positionals
# unmapped and claim nothing.
#
# Silence was the right answer to the wrong question. The command really does
# read `/etc/hosts`; what it does not do is read one *here*. So slot 0 is the
# machine and the rest is a command, and those two statements together are what
# make the payload a remote command: `cat`'s own recipe applies, its read edge
# exists, and the edge is marked remote. The jail asks for local paths and gets
# nothing — by decision now, not by omission.
[[cmd]]
name = "ssh"
[cmd.flags]
"-i" = { takes = true, kind = "path", effect = ["read"] }
"-F" = { takes = true, kind = "path", effect = ["read"] }
"-o" = { takes = true }
"-p" = { takes = true }
"-l" = { takes = true }
"-L" = { takes = true }
"-R" = { takes = true }
"-J" = { takes = true }
"-c" = { takes = true }
[[cmd.args]]
slots = "first"
kind = "host"
# the payload starts after the host, which is what `1+` says. `rest` would take
# the hostname itself as the program to run.
[[cmd.args]]
slots = "1+"
kind = "cmd"
effect = ["exec"]
