# Same reasoning as kubectl: a container's paths are not this machine's, so only
# unambiguously local flags are mapped and positionals are left silent.
[[cmd]]
name = "docker"
[cmd.flags]
"-f" = { takes = true, kind = "path", effect = ["read"] }
"--file" = { takes = true, kind = "path", effect = ["read"] }
"--env-file" = { takes = true, kind = "path", effect = ["read"] }
"-v" = { takes = true }
"--volume" = { takes = true }
"-e" = { takes = true }
"--name" = { takes = true }
"-p" = { takes = true }

# `docker exec CONTAINER CMD...` — the kubectl-exec shape: slot 0 is the
# machine, the rest is the payload, and its paths land as remote.
[[cmd]]
name = "docker"
subcommand = "exec"
[cmd.flags]
"-i" = { takes = false }
"--interactive" = { takes = false }
"-t" = { takes = false }
"--tty" = { takes = false }
"-d" = { takes = false }
"--detach" = { takes = false }
"-u" = { takes = true }
"--user" = { takes = true }
"-w" = { takes = true }
"--workdir" = { takes = true }
[[cmd.args]]
slots = "first"
kind = "container"
[[cmd.args]]
slots = "1+"
kind = "cmd"
effect = ["exec"]

# effect claims for `on = {...}` verdict rules; positionals stay silent per the
# note above
[[cmd]]
name = "docker"
subcommand = "ps"
effect = ["read"]

