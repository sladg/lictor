[[cmd]]
name = "env"
[cmd.flags]
"-u" = { takes = true }
"--unset" = { takes = true }
"-C" = { takes = true }
"--chdir" = { takes = true }
"-S" = { takes = true }
"--split-string" = { takes = true }
[[cmd.args]]
slots = "rest"
kind = "assignment"

[[cmd.args]]
slots = "rest"
kind = "cmd"
effect = ["exec"]
