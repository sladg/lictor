# `-c` carries a shell script. `kind = "shell"` — not `code` — because this
# parser can read it: the string is re-parsed and grafted behind a `spawns`
# edge, so `sh -c 'cat /etc/passwd'` claims the read instead of nothing.
# The interpreters (python3, perl) keep `code`: lowering their payloads as
# bash would manufacture claims about a language the graph cannot parse.
[[cmd]]
name = "sh"
[cmd.flags]
"-c" = { takes = true, kind = "shell", effect = ["exec"] }
"-o" = { takes = true }
# an rcfile is executed before the script is — a path, and an exec vector
"--rcfile" = { takes = true, kind = "path", effect = ["read"] }
"--init-file" = { takes = true, kind = "path", effect = ["read"] }
[[cmd.args]]
slots = "first"
kind = "path"
effect = ["read"]
when = { without = ["-c"] }
