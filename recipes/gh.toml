[[cmd]]
name = "gh"
[cmd.flags]
"-f" = { takes = true }
"-F" = { takes = true }
"-H" = { takes = true }
"-X" = { takes = true }
"-q" = { takes = true }
"--jq" = { takes = true, kind = "code" }
"-R" = { takes = true }
"--repo" = { takes = true }

# subcommands with filesystem surface — the remote-state policy lives in the
# gh-write/gh-read catalogs; recipes only say which words are LOCAL paths

[[cmd]]
name = "gh"
subcommand = "release upload"
effect = ["write"]
# slot 0 is the release TAG; every later positional is an asset file. Entries
# resolve last-match-wins, so the `first = none` line shadows `all` for slot 0.
[[cmd.args]]
slots  = "all"
kind   = "path"
effect = ["read"]
[[cmd.args]]
slots  = "first"
kind   = "none"

[[cmd]]
name = "gh"
subcommand = "release download"
effect = ["read"]
[cmd.flags]
"-D" = { takes = true, kind = "path", effect = ["create", "write"] }
"--dir" = { takes = true, kind = "path", effect = ["create", "write"] }
"-O" = { takes = true, kind = "path", effect = ["create", "write"] }
"--output" = { takes = true, kind = "path", effect = ["create", "write"] }

[[cmd]]
name = "gh"
subcommand = "run download"
effect = ["read"]
[cmd.flags]
"-D" = { takes = true, kind = "path", effect = ["create", "write"] }
"--dir" = { takes = true, kind = "path", effect = ["create", "write"] }

[[cmd]]
name = "gh"
subcommand = "repo clone"
effect = ["read"]
[[cmd.args]]
slots  = "1"
kind   = "path"
effect = ["create"]

[[cmd]]
name = "gh"
subcommand = "gist create"
effect = ["write"]
[[cmd.args]]
slots  = "all"
kind   = "path"
effect = ["read"]

[[cmd]]
name = "gh"
subcommand = "pr create"
effect = ["write"]
[cmd.flags]
"-F" = { takes = true, kind = "path", effect = ["read"] }
"--body-file" = { takes = true, kind = "path", effect = ["read"] }

[[cmd]]
name = "gh"
subcommand = "issue create"
effect = ["write"]
[cmd.flags]
"-F" = { takes = true, kind = "path", effect = ["read"] }
"--body-file" = { takes = true, kind = "path", effect = ["read"] }

[[cmd]]
name = "gh"
subcommand = "release create"
effect = ["write"]
[cmd.flags]
"-F" = { takes = true, kind = "path", effect = ["read"] }
"--notes-file" = { takes = true, kind = "path", effect = ["read"] }

[[cmd]]
name = "gh"
subcommand = "api"
effect = ["read", "write"]
[cmd.flags]
"--input" = { takes = true, kind = "path", effect = ["read"] }

# effect claims for the remote-noun subcommands: no local paths, but an
